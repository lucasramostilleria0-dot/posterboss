        <input class="form-input" id="p-name" placeholder="Nombre del diseño">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Categoría</label>
          <select class="form-select" id="p-cat">
            ${s.categories.map(c => `<option>${c}</option>`).join('')}
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Tamaño</label>
          <select class="form-select" id="p-size">
            ${s.sizes.map(sz => `<option value="${sz.id}">${sz.name}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Precio venta (€)</label>
          <input class="form-input" type="number" step="0.01" id="p-price" placeholder="0.00" oninput="productCalc()">
        </div>
        <div class="form-group">
          <label class="form-label">Coste (€)</label>
          <input class="form-input" type="number" step="0.01" id="p-cost" placeholder="0.00" oninput="productCalc()">
        </div>
      </div>
      <div id="p-calc" style="font-size:12px;color:var(--text2);margin-bottom:10px"></div>
      <div class="form-group">
        <label class="form-label">Notas</label>
        <textarea class="form-textarea" id="p-notes" placeholder="Notas del diseño..."></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">Imagen</label>
        <label class="img-upload-area">
          📷 Añadir imagen del diseño
          <input type="file" accept="image/*" multiple style="display:none" id="p-img-input">
        </label>
      </div>
      <button class="btn btn-primary btn-full" onclick="productSave()">Guardar diseño</button>
      <div style="height:12px"></div>
    `);

    window.productCalc = () => {
      const price = parseFloat($('p-price')?.value) || 0;
      const cost = parseFloat($('p-cost')?.value) || 0;
      const profit = price - cost;
      const margin = price > 0 ? profit/price*100 : 0;
      const el = $('p-calc');
      if (el) el.innerHTML = `Beneficio: <strong style="color:var(--green)">${fmt(profit)}</strong> · Margen: ${fmtPct(margin)}`;
    };

    window.productSave = async () => {
      const imgInput = $('p-img-input');
      let images = [];
      if (imgInput && imgInput.files.length) images = await handleImgUpload(imgInput);
      const price = parseFloat($('p-price')?.value) || 0;
      const cost = parseFloat($('p-cost')?.value) || 0;
      const sizeId = $('p-size')?.value;
      const sz = getSizeById(sizeId);
      const product = {
        id: uid(),
        name: $('p-name')?.value || 'Sin nombre',
        category: $('p-cat')?.value || '',
        sizeId, size: sz?.name || sizeId,
        price, cost,
        profit: price - cost,
        margin: price > 0 ? (price-cost)/price*100 : 0,
        notes: $('p-notes')?.value || '',
        images,
        available: true,
        createdAt: new Date().toISOString()
      };
      const catalog = DB.get('catalog') || [];
      catalog.push(product);
      DB.set('catalog', catalog);
      App.forceCloseDrawer();
      App.toast('Diseño guardado');
      Pages.catalog();
    };
  },

  newCashMovement() {
    App.openDrawer('Movimiento de caja', `
      <div class="form-group">
        <label class="form-label">Tipo</label>
        <select class="form-select" id="cash-type">
          <option value="in">Entrada 💵</option>
          <option value="out">Salida 💸</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Concepto</label>
        <input class="form-input" id="cash-label" placeholder="Descripción...">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Cantidad (€)</label>
          <input class="form-input" type="number" step="0.01" id="cash-amount" placeholder="0.00">
        </div>
        <div class="form-group">
          <label class="form-label">Método</label>
          <select class="form-select" id="cash-method">
            <option>Efectivo</option>
            <option>Banco</option>
            <option>Tarjeta</option>
            <option>Bizum</option>
            <option>Otro</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Fecha</label>
        <input class="form-input" type="date" id="cash-date" value="${today()}">
      </div>
      <button class="btn btn-primary btn-full" onclick="cashSave()">Guardar movimiento</button>
      <div style="height:12px"></div>
    `);
    window.cashSave = () => {
      const amount = parseFloat($('cash-amount')?.value) || 0;
      if (!amount) { App.toast('Introduce una cantidad', 'error'); return; }
      const mov = {
        id: uid(),
        type: $('cash-type')?.value || 'in',
        label: $('cash-label')?.value || '',
        amount,
        method: $('cash-method')?.value || 'Efectivo',
        date: $('cash-date')?.value || today()
      };
      const movs = DB.get('cashMovements') || [];
      movs.push(mov);
      DB.set('cashMovements', movs);
      App.forceCloseDrawer();
      App.toast('Movimiento registrado');
      App.navigate(App.currentPage);
    };
  }
};

// =============================================
// MODALS (full screen detail views)
// =============================================
const Modals = {
  orderDetail(id) {
    const orders = DB.get('orders') || [];
    const order = orders.find(o => o.id === id);
    if (!order) return;

    const statuses = ['pending','preparing','ready','sent','delivered','cancelled'];

    App.openModal(order.client || 'Pedido', `
      <div style="height:8px"></div>

      <!-- STATUS CHANGE -->
      <div class="section-label">Estado</div>
      <div class="chip-row" style="margin-bottom:14px">
        ${statuses.map(st => `
          <div class="chip ${order.status===st?'active':''}" onclick="OrderDetail.setStatus('${id}','${st}')">${statusEmoji(st)} ${statusLabel(st)}</div>
        `).join('')}
      </div>

      <!-- FINANCIAL SUMMARY -->
      <div class="card" style="margin-bottom:12px">
        <div class="card-body">
          ${order.discPct > 0 ? `
            <div class="calc-row"><span class="label">Precio normal</span><span class="value">${fmt(order.price)}</span></div>
            <div class="calc-row"><span class="label">Descuento ${order.discPct}%</span><span class="value red">−${fmt(order.discAmt)}</span></div>
          ` : ''}
          <div class="calc-row total"><span class="label">Precio final</span><span class="value accent">${fmt(order.finalPrice)}</span></div>
          <div class="calc-row"><span class="label">Coste producción</span><span class="value red">−${fmt(order.cost)}</span></div>
          <div class="calc-row"><span class="label">Beneficio</span><span class="value green">${fmt(order.profit)}</span></div>
          <div class="calc-row"><span class="label">Margen</span><span class="value">${fmtPct(order.margin)}</span></div>
        </div>
      </div>

      <!-- ITEMS -->
      <div class="section-label">Productos</div>
      <div class="card" style="margin-bottom:12px">
        <div class="card-body" style="padding:4px 14px">
          ${(order.items||[]).map(item => `
            <div class="list-item">
              <div class="list-item-icon">🖼️</div>
              <div class="list-item-info">
                <div class="list-item-title">${item.qty} × ${item.sizeName || item.sizeId}</div>
                <div class="list-item-sub">${fmt(item.priceSnapshot)}/ud · Coste: ${fmt(item.costSnapshot)}/ud</div>
              </div>
              <div class="list-item-right">
                <div class="list-item-amount">${fmt(item.priceSnapshot * item.qty)}</div>
              </div>
            </div>
          `).join('')}
        </div>
      </div>

      <!-- DETAILS -->
      <div class="section-label">Detalles</div>
      <div class="card" style="margin-bottom:12px">
        <div class="card-body">
          <div class="calc-row"><span class="label">Cliente</span><span class="value">${order.client || '—'}</span></div>
          <div class="calc-row"><span class="label">Fecha pedido</span><span class="value">${fmtDateFull(order.date)}</span></div>
          <div class="calc-row"><span class="label">Fecha envío</span><span class="value">${order.shipDate ? fmtDateFull(order.shipDate) : '—'}</span></div>
          ${order.notes ? `<div class="calc-row" style="flex-direction:column;align-items:flex-start;gap:4px"><span class="label">Notas</span><span style="font-size:13px;color:var(--text);line-height:1.5">${order.notes}</span></div>` : ''}
        </div>
      </div>

      <!-- IMAGES -->
      ${order.images && order.images.length ? `
        <div class="section-label">Imágenes</div>
        <div class="img-thumbs" style="margin-bottom:14px">${order.images.map(img => imgToThumb(img)).join('')}</div>
      ` : ''}

      <!-- ACTIONS -->
      <div style="display:flex;gap:8px;margin-bottom:24px">
        <button class="btn btn-secondary btn-full" onclick="OrderDetail.editNotes('${id}')">✏️ Editar notas</button>
        <button class="btn btn-danger" onclick="OrderDetail.delete('${id}')">🗑️</button>
      </div>
    `, `<button class="icon-btn" onclick="OrderDetail.addImg('${id}')">📷</button>`);
  },

  productDetail(id) {
    const catalog = DB.get('catalog') || [];
    const p = catalog.find(pr => pr.id === id);
    if (!p) return;

    App.openModal(p.name, `
      <div style="height:8px"></div>
      ${p.images && p.images[0] ? `<img src="${p.images[0]}" style="width:100%;height:200px;object-fit:cover;border-radius:var(--radius);margin-bottom:14px;display:block" onclick="App.lightbox('${p.images[0]}')">` : ''}
      
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px">
        <span class="cat-tag">${p.category}</span>
        <span class="cat-tag">${p.size || p.sizeId}</span>
        <span class="cat-tag" style="${p.available!==false ? 'color:var(--green)' : 'color:var(--red)'}">
          ${p.available !== false ? '✓ Disponible' : '× No disponible'}
        </span>
      </div>

      <div class="card" style="margin-bottom:12px">
        <div class="card-body">
          <div class="calc-row total"><span class="label">Precio venta</span><span class="value accent">${fmt(p.price)}</span></div>
          <div class="calc-row"><span class="label">Coste</span><span class="value red">−${fmt(p.cost)}</span></div>
          <div class="calc-row"><span class="label">Beneficio</span><span class="value green">${fmt(p.profit)}</span></div>
          <div class="calc-row"><span class="label">Margen</span><span class="value">${fmtPct(p.margin)}</span></div>
        </div>
      </div>

      ${p.notes ? `<div class="card" style="margin-bottom:12px"><div class="card-body" style="font-size:13px;color:var(--text2);line-height:1.6">${p.notes}</div></div>` : ''}

      ${(p.images||[]).length > 1 ? `
        <div class="img-thumbs" style="margin-bottom:14px">${p.images.map(img => imgToThumb(img)).join('')}</div>
      ` : ''}

      <div style="display:flex;gap:8px;margin-bottom:12px">
        <button class="btn ${p.available!==false?'btn-secondary':'btn-success'} btn-full" onclick="ProductDetail.toggleAvail('${id}')">
          ${p.available !== false ? 'Marcar no disponible' : 'Marcar disponible'}
        </button>
        <button class="btn btn-danger" onclick="ProductDetail.delete('${id}')">🗑️</button>
      </div>
      <div style="height:24px"></div>
    `);
  }
};

const OrderDetail = {
  setStatus(id, status) {
    const orders = DB.get('orders') || [];
    const o = orders.find(o => o.id === id);
    if (o) { o.status = status; DB.set('orders', orders); }
    App.updateBadge();
    Modals.orderDetail(id);
  },
  editNotes(id) {
    const orders = DB.get('orders') || [];
    const o = orders.find(o => o.id === id);
    if (!o) return;
    App.openDrawer('Notas del pedido', `
      <div class="form-group">
        <label class="form-label">Notas</label>
        <textarea class="form-textarea" id="edit-order-notes" style="height:150px">${o.notes||''}</textarea>
      </div>
      <button class="btn btn-primary btn-full" onclick="saveOrderNotes('${id}')">Guardar</button>
      <div style="height:12px"></div>
    `);
    window.saveOrderNotes = (id) => {
      const orders = DB.get('orders') || [];
      const o = orders.find(o => o.id === id);
      if (o) { o.notes = $('edit-order-notes')?.value || ''; DB.set('orders', orders); }
      App.forceCloseDrawer();
      App.toast('Notas guardadas');
      Modals.orderDetail(id);
    };
  },
  async addImg(id) {
    const input = document.createElement('input');
    input.type = 'file'; input.accept = 'image/*'; input.multiple = true;
    input.onchange = async () => {
      const orders = DB.get('orders') || [];
      const o = orders.find(o => o.id === id);
      if (!o) return;
      o.images = await handleImgUpload(input, o.images || []);
      DB.set('orders', orders);
      App.toast('Imagen añadida');
      Modals.orderDetail(id);
    };
    input.click();
  },
  delete(id) {
    if (!confirm('¿Eliminar este pedido? Esta acción no se puede deshacer.')) return;
    let orders = DB.get('orders') || [];
    orders = orders.filter(o => o.id !== id);
    DB.set('orders', orders);
    App.closeModal();
    App.toast('Pedido eliminado');
    App.updateBadge();
  }
};

const ProductDetail = {
  toggleAvail(id) {
    const catalog = DB.get('catalog') || [];
    const p = catalog.find(p => p.id === id);
    if (p) { p.available = !p.available; DB.set('catalog', catalog); }
    Modals.productDetail(id);
  },
  delete(id) {
    if (!confirm('¿Eliminar este diseño?')) return;
    let catalog = DB.get('catalog') || [];
    catalog = catalog.filter(p => p.id !== id);
    DB.set('catalog', catalog);
    App.closeModal();
    App.toast('Diseño eliminado');
  }
};

// =============================================
// DATA IMPORT/EXPORT
// =============================================
const DataIO = {
  showOptions() {
    App.openDrawer('Datos', `
      <div style="margin-bottom:12px">
        <div style="font-size:13px;color:var(--text2);margin-bottom:12px">Exporta tus datos para hacer una copia de seguridad o importa datos desde una copia anterior.</div>
        <button class="btn btn-secondary btn-full" onclick="DataIO.exportJSON()" style="margin-bottom:8px">📤 Exportar datos (JSON)</button>
        <button class="btn btn-secondary btn-full" onclick="DataIO.exportCSV()" style="margin-bottom:8px">📊 Exportar pedidos (CSV)</button>
        <label class="btn btn-secondary btn-full" style="justify-content:center;cursor:pointer">
          📥 Importar datos (JSON)
          <input type="file" accept=".json" style="display:none" onchange="DataIO.importJSON(this)">
        </label>
      </div>
      <div class="divider"></div>
      <div style="margin-top:12px">
        <button class="btn btn-danger btn-full" onclick="DataIO.resetAll()">⚠️ Resetear todos los datos</button>
      </div>
      <div style="height:12px"></div>
    `);
  },

  exportJSON() {
    const keys = ['settings','orders','catalog','notes','expenses','tasks','goalContributions','cashMovements'];
    const data = {};
    keys.forEach(k => { data[k] = DB.get(k); });
    data._exported = new Date().toISOString();
    data._version = '1.0';
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `posterboss-backup-${today()}.json`;
    a.click(); URL.revokeObjectURL(url);
    App.toast('Datos exportados');
  },

  exportCSV() {
    const orders = DB.get('orders') || [];
    const rows = [['ID','Cliente','Fecha','Estado','Items','Precio','Descuento','Precio Final','Coste','Beneficio','Margen%','Notas']];
    orders.forEach(o => {
      rows.push([
        o.id, o.client, o.date, statusLabel(o.status),
        (o.items||[]).map(i => `${i.qty}x${i.sizeName}`).join('+'),
        o.price, o.discAmt, o.finalPrice, o.cost, o.profit,
        (o.margin||0).toFixed(1), o.notes
      ]);
    });
    const csv = rows.map(r => r.map(c => `"${String(c||'').replace(/"/g,'""')}"`).join(',')).join('\n');
    const blob = new Blob(['\ufeff'+csv], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `posterboss-pedidos-${today()}.csv`;
    a.click(); URL.revokeObjectURL(url);
    App.toast('CSV exportado');
  },

  importJSON(input) {
    const file = input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const data = JSON.parse(e.target.result);
        const keys = ['settings','orders','catalog','notes','expenses','tasks','goalContributions','cashMovements'];
        keys.forEach(k => { if (data[k] !== undefined) DB.set(k, data[k]); });
        App.forceCloseDrawer();
        App.toast('Datos importados correctamente');
        App.navigate('home');
      } catch(err) {
        App.toast('Error al importar: JSON inválido', 'error');
      }
    };
    reader.readAsText(file);
  },

  resetAll() {
    if (!confirm('⚠️ ¿Eliminar TODOS los datos? Esta acción no se puede deshacer.')) return;
    if (!confirm('¿Estás seguro? Se eliminarán pedidos, catálogo, notas y todo lo demás.')) return;
    const keys = ['settings','orders','catalog','notes','expenses','tasks','goalContributions','cashMovements'];
    keys.forEach(k => localStorage.removeItem('pb_' + k));
    App.forceCloseDrawer();
    App.toast('Datos eliminados. Recargando...');
    setTimeout(() => location.reload(), 1500);
  }
};

// =============================================
// INIT
// =============================================
document.addEventListener('DOMContentLoaded', () => {
  App.init();
});
</script>
